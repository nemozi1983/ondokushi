<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>音声文字起こし</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
    background: #fff;
  }

  /* ボタンバーの高さを固定 */
  :root { --bar-h: 72px; }

  /* テキスト表示エリア：上端からボタンバーの上まで */
  #text-area {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 18px;
    font-size: 40px;
    line-height: 1.5;
    color: #111;
    background: #F8F8F6;
    word-break: break-all;
    white-space: pre-wrap;
  }
  #text-area.placeholder { color: #bbb; font-size: 20px; }

  /* ボタンバー：画面下に固定 */
  #btn-bar {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: calc(var(--bar-h) + env(safe-area-inset-bottom));
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: #F0F0EC;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ステータス：ボタンバーのすぐ上に小さく */
  #status {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    color: #888;
    background: rgba(255,255,255,0.85);
    padding: 2px;
    pointer-events: none;
  }

  .btn {
    height: 52px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #1D9E75;
    color: #fff;
  }
  #rec-btn { flex: 2.2; }
  .btn.secondary {
    flex: 1;
    background: #fff;
    border: 0.5px solid #ccc;
    color: #555;
    font-weight: normal;
  }
  #rec-btn.recording { background: #E24B4A; }
</style>
</head>
<body>

<div id="text-area" class="placeholder">録音開始を押して話してください</div>

<div id="status"></div>

<div id="btn-bar">
  <button class="btn secondary" onclick="changeFontSize(-4)">A-</button>
  <button class="btn secondary" onclick="changeFontSize(4)">A+</button>
  <button class="btn secondary" onclick="clearText()">クリア</button>
  <button class="btn secondary" onclick="copyText()">コピー</button>
  <button class="btn" id="rec-btn" onclick="toggleRecording()">● 録音開始</button>
</div>

<script>
  const textArea = document.getElementById('text-area');
  const statusEl = document.getElementById('status');
  const recBtn = document.getElementById('rec-btn');

  let recognition = null;
  let isRecording = false;
  let finalText = '';
  let fontSize = 40;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript;
        } else {
          interim += transcript;
        }
      }
      textArea.classList.remove('placeholder');
      textArea.textContent = finalText + interim;
      textArea.scrollTop = textArea.scrollHeight;
    };

    recognition.onend = () => {
      if (isRecording) {
        try { recognition.start(); } catch (e) {}
      }
    };

    recognition.onerror = (event) => {
      // 無音やユーザー操作による停止は無害なので無視
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      statusEl.textContent = 'エラー: ' + event.error;
    };
  } else {
    statusEl.textContent = 'このブラウザは音声認識に非対応です';
    recBtn.disabled = true;
  }

  function toggleRecording() {
    if (!recognition) return;
    if (isRecording) {
      isRecording = false;
      recognition.stop();
      recBtn.textContent = '● 録音開始';
      recBtn.classList.remove('recording');
      statusEl.textContent = '停止しました';
    } else {
      isRecording = true;
      try { recognition.start(); } catch (e) {}
      recBtn.textContent = '■ 録音停止';
      recBtn.classList.add('recording');
      statusEl.textContent = '録音中...';
    }
  }

  function changeFontSize(delta) {
    fontSize = Math.min(72, Math.max(20, fontSize + delta));
    textArea.style.fontSize = fontSize + 'px';
  }

  function clearText() {
    finalText = '';
    textArea.textContent = '録音開始を押して話してください';
    textArea.classList.add('placeholder');
    statusEl.textContent = '';
  }

  function copyText() {
    const t = finalText.trim();
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
      statusEl.textContent = 'コピーしました';
      setTimeout(() => {
        statusEl.textContent = isRecording ? '録音中...' : '';
      }, 1500);
    });
  }
</script>
</body>
</html>
