<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音声文字起こし</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, sans-serif;
    background: #fff; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* テキスト表示エリア（画面の大部分） */
  #text-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    font-size: 40px;
    line-height: 1.5;
    color: #111;
    background: #F8F8F6;
    word-break: break-all;
    white-space: pre-wrap;
    -webkit-overflow-scrolling: touch;
  }
  #text-area.placeholder { color: #bbb; font-size: 20px; }

  /* ステータス */
  #status {
    flex-shrink: 0;
    text-align: center;
    font-size: 13px;
    color: #888;
    padding: 6px;
  }

  /* ボタンバー */
  #btn-bar {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 10px 12px 16px;
    background: #F0F0EC;
  }
  .btn {
    padding: 14px 4px;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #1D9E75;
    color: #fff;
  }
  #rec-btn { flex: 2.2; }
  .btn.secondary {
    flex: 1;
    background: transparent;
    border: 0.5px solid #ccc;
    color: #555;
    font-weight: normal;
  }
  #rec-btn.recording { background: #E24B4A; }
</style>
</head>
<body>

<div id="text-area" class="placeholder">録音開始を押して話してください</div>

<div id="status"></div>

<div id="btn-bar">
  <button class="btn" id="rec-btn" onclick="toggleRecording()">● 録音開始</button>
  <button class="btn secondary" onclick="changeFontSize(-4)">A-</button>
  <button class="btn secondary" onclick="changeFontSize(4)">A+</button>
  <button class="btn secondary" onclick="clearText()">クリア</button>
  <button class="btn secondary" onclick="copyText()">コピー</button>
</div>

<script>
  const textArea = document.getElementById('text-area');
  const statusEl = document.getElementById('status');
  const recBtn = document.getElementById('rec-btn');

  let recognition = null;
  let isRecording = false;
  let finalText = '';
  let fontSize = 40;

  // Web Speech API 初期化
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript;
        } else {
          interim += transcript;
        }
      }
      textArea.classList.remove('placeholder');
      textArea.textContent = finalText + interim;
      textArea.scrollTop = textArea.scrollHeight;
    };

    recognition.onend = () => {
      // 録音中なら自動で再開（連続認識を維持）
      if (isRecording) {
        try { recognition.start(); } catch (e) {}
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech') return;
      statusEl.textContent = 'エラー: ' + event.error;
    };
  } else {
    statusEl.textContent = 'このブラウザは音声認識に対応していません（Chromeを推奨）';
    recBtn.disabled = true;
  }

  function toggleRecording() {
    if (!recognition) return;
    if (isRecording) {
      isRecording = false;
      recognition.stop();
      recBtn.textContent = '● 録音開始';
      recBtn.classList.remove('recording');
      statusEl.textContent = '停止しました';
    } else {
      isRecording = true;
      try { recognition.start(); } catch (e) {}
      recBtn.textContent = '■ 録音停止';
      recBtn.classList.add('recording');
      statusEl.textContent = '録音中...';
    }
  }

  function changeFontSize(delta) {
    fontSize = Math.min(72, Math.max(20, fontSize + delta));
    textArea.style.fontSize = fontSize + 'px';
  }

  function clearText() {
    finalText = '';
    textArea.textContent = '録音開始を押して話してください';
    textArea.classList.add('placeholder');
    statusEl.textContent = '';
  }

  function copyText() {
    const t = finalText.trim();
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
      statusEl.textContent = 'コピーしました';
      setTimeout(() => {
        if (isRecording) statusEl.textContent = '録音中...';
        else statusEl.textContent = '';
      }, 1500);
    });
  }
</script>
</body>
</html>
